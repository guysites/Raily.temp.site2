<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">The new wave of AI interactions meets two kinds of organizations</title><desc id="d">People, personal AI, AI agents and new interfaces send interactions to both organizations. The traditional organization lets human traffic through but blocks AI traffic. The Raily-enabled organization accepts all interaction types and connects directly to organizational data, which includes databases, content, object data, vector stores and knowledge.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142b49"/><stop offset="1" stop-color="#091629"/></linearGradient><radialGradient id="halo"><stop stop-color="#6688ee" stop-opacity=".28"/><stop offset="1" stop-color="#6688ee" stop-opacity="0"/></radialGradient><linearGradient id="fast"><stop stop-color="#67d7eb"/><stop offset=".5" stop-color="#8ea5ff"/><stop offset="1" stop-color="#d7f28c"/></linearGradient><linearGradient id="blocked" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="680" y2="0"><stop stop-color="#67d7eb" stop-opacity=".95"/><stop offset=".58" stop-color="#8ea5ff" stop-opacity=".75"/><stop offset="1" stop-color="#ff8c9b" stop-opacity=".06"/></linearGradient>
<style>
.cap{font:700 13px Arial;letter-spacing:2px;fill:#91a9d0}.head{font:700 19px Arial;fill:#edf5ff}.sub{font:13px Arial;fill:#a8bad3}.tiny{font:700 10px Arial;letter-spacing:1.4px;fill:#a9bdd8}
.fast{fill:none;stroke:url(#fast);stroke-linecap:round}.slow{fill:none;stroke:#8798b2;stroke-linecap:round}
.traffic-a{stroke-dasharray:18 10;animation:move 7s linear infinite;opacity:.72}
@keyframes move{to{stroke-dashoffset:-224}}
@media(prefers-reduced-motion:reduce){.traffic-a{animation:none}}
</style></defs>
<rect width="1440" height="760" rx="28" fill="url(#bg)"/><ellipse cx="760" cy="360" rx="700" ry="390" fill="url(#halo)"/>
<g opacity=".1" stroke="#8ea5ff"><path d="M0 150H1440M0 300H1440M0 450H1440M0 600H1440"/><path d="M180 0V760M360 0V760M540 0V760M720 0V760M900 0V760M1080 0V760M1260 0V760"/></g>
<text x="52" y="54" class="cap">A NEW INTERFACE IS EMERGING</text><text x="52" y="91" font-family="Arial" font-size="27" font-weight="700" fill="#f0f6ff">The volume, speed and variety of interactions are changing.</text>
<!-- incoming channels -->
<text x="52" y="145" class="tiny">WHO IS COMING?</text>
<g font-family="Arial">
<g transform="translate(55 178)"><circle cx="27" cy="27" r="23" fill="#2b4669" stroke="#a9bdd8"/><circle cx="27" cy="20" r="7" fill="#e0ebfa"/><path d="M14 42Q27 26 40 42" fill="none" stroke="#e0ebfa" stroke-width="6" stroke-linecap="round"/><text x="64" y="25" class="head">People</text><text x="64" y="46" class="sub">Direct interactions</text></g>
<g transform="translate(55 292)"><circle cx="27" cy="27" r="23" fill="#293f78" stroke="#8ea5ff"/><path d="M27 9L33 21L45 27L33 33L27 45L21 33L9 27L21 21Z" fill="#dce6ff"/><text x="64" y="25" class="head">Personal AI</text><text x="64" y="46" class="sub">Acting for individuals</text></g>
<g transform="translate(55 406)"><circle cx="27" cy="27" r="23" fill="#214665" stroke="#67d7eb"/><rect x="14" y="14" width="26" height="26" rx="7" fill="#c9f4ff"/><circle cx="22" cy="24" r="2" fill="#18385b"/><circle cx="32" cy="24" r="2" fill="#18385b"/><path d="M21 32H33" stroke="#18385b" stroke-width="2"/><text x="64" y="25" class="head">AI agents</text><text x="64" y="46" class="sub">Searching, deciding, acting</text></g>
<g transform="translate(55 520)"><circle cx="27" cy="27" r="23" fill="#28465b" stroke="#d7f28c"/><path d="M13 27H41M27 13V41M17 17L37 37M37 17L17 37" stroke="#d7f28c" stroke-width="2.5"/><text x="64" y="25" class="head">New AI interfaces</text><text x="64" y="46" class="sub">New ways to reach you</text></g></g>
<!-- old org -->
<text x="500" y="145" class="tiny">TWO KINDS OF ORGANIZATIONS</text>
<g transform="translate(500 178)"><rect width="390" height="190" rx="22" fill="#1a2c45" stroke="#788ba6" stroke-width="1.5"/><text x="26" y="42" class="head">Traditional organization</text><text x="26" y="66" class="sub">Built for a few known channels</text><rect x="25" y="91" width="340" height="70" rx="13" fill="#13243b" stroke="#63758e" stroke-dasharray="5 7"/><path d="M0 125H92" stroke="#9baac0" stroke-width="3"/></g>
<!-- Raily org -->
<g transform="translate(500 405)"><rect width="390" height="220" rx="22" fill="#16334f" stroke="#8ea5ff" stroke-width="2"/><rect x="10" y="10" width="370" height="200" rx="17" fill="none" stroke="#67d7eb" stroke-opacity=".35"/><circle cx="345" cy="34" r="5" fill="#d7f28c"/><text x="25" y="43" class="head">Raily-enabled organization</text><text x="25" y="67" class="sub">Ready for every interaction type</text><rect x="22" y="91" width="346" height="82" rx="13" fill="#102740" stroke="#67d7eb"/><text x="40" y="119" class="tiny" fill="#a4eafa">RAILY · GOVERNED ACCESS LAYER</text><text x="40" y="152" font-family="Arial" font-size="14" fill="#eaf5ff">Fast · contextual · permission-aware</text><text x="24" y="198" class="tiny" fill="#d7f28c">WIDE CAPACITY · MULTIPLE CHANNELS · CONTROL</text></g>
<!-- Bidirectional traffic: two parallel streams move in opposite directions -->
<!-- Traditional organization: human traffic passes through to organizational data -->
<path class="traffic-a" d="M260 205 C365 205 405 260 500 260 H890 C980 260 1015 292 1097 315" fill="none" stroke="#8798b2" stroke-width="3" />
<!-- AI traffic fades as it enters the traditional organization and stops -->
<path class="traffic-a" d="M260 319 C365 319 410 292 660 292" fill="none" stroke="url(#blocked)" stroke-width="5" />
<path class="traffic-a" d="M260 433 C365 433 410 316 660 316" fill="none" stroke="url(#blocked)" stroke-width="5" style="animation-delay:-.9s"/>
<path class="traffic-a" d="M260 547 C365 547 410 340 660 340" fill="none" stroke="url(#blocked)" stroke-width="5" style="animation-delay:-1.8s"/>
<!-- Explicit stop barriers just beyond the fading AI paths -->
<g transform="translate(682 294)"><path d="M-11 -18H11L18 -11V11L11 18H-11L-18 11V-11Z" fill="#512d43" stroke="#ff8c9b" stroke-width="3"/><path d="M-8 0H8" stroke="#ffe5e9" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(682 318)"><path d="M-11 -18H11L18 -11V11L11 18H-11L-18 11V-11Z" fill="#512d43" stroke="#ff8c9b" stroke-width="3"/><path d="M-8 0H8" stroke="#ffe5e9" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(682 342)"><path d="M-11 -18H11L18 -11V11L11 18H-11L-18 11V-11Z" fill="#512d43" stroke="#ff8c9b" stroke-width="3"/><path d="M-8 0H8" stroke="#ffe5e9" stroke-width="4" stroke-linecap="round"/></g>
<!-- Raily-enabled organization: people and AI traffic flow both ways -->
<path class="traffic-a" d="M260 205 C365 205 395 444 500 444" fill="none" stroke="#8798b2" stroke-width="3" />
<path class="traffic-a" d="M260 319 C370 319 400 482 500 482" fill="none" stroke="url(#fast)" stroke-width="5" />
<path class="traffic-a" d="M260 433 C370 433 405 520 500 520" fill="none" stroke="url(#fast)" stroke-width="5" style="animation-delay:-.9s"/>
<path class="traffic-a" d="M260 547 C370 547 405 558 500 558" fill="none" stroke="url(#fast)" stroke-width="5" style="animation-delay:-1.8s"/>
<!-- People and Raily traffic both connect to the organization data hub -->
<path class="traffic-a" d="M890 444 C975 444 1010 350 1097 315" fill="none" stroke="#8798b2" stroke-width="3" />
<path class="traffic-a" d="M890 515 C970 515 985 315 1097 315" fill="none" stroke="url(#fast)" stroke-width="8" />

<text x="970" y="145" class="tiny">CONNECTED DATA SOURCES</text>
<g transform="translate(1030 190)"><circle cx="150" cy="125" r="115" fill="#6889e8" opacity=".09"/><circle cx="150" cy="125" r="83" fill="#142b48" stroke="#8ea5ff" stroke-width="2"/><circle cx="150" cy="125" r="63" fill="none" stroke="#67d7eb" stroke-dasharray="5 8"/><path d="M124 96H176V154H124Z" fill="#244a70" stroke="#d7f28c" stroke-width="2"/><path d="M135 110H165M135 124H165M135 138H158" stroke="#d8f4ff" stroke-width="3" stroke-linecap="round"/><text x="150" y="235" text-anchor="middle" class="head">Your organization's data</text><text x="150" y="257" text-anchor="middle" class="sub">Connected · contextualized · governed</text></g>
<g><path class="traffic-a" d="M1180 448L1020 520" fill="none" stroke="#67d7eb" stroke-width="2" opacity=".6"/><path class="traffic-a" d="M1180 448L1170 520" fill="none" stroke="#67d7eb" stroke-width="2" opacity=".6"/><path class="traffic-a" d="M1180 448L1320 520" fill="none" stroke="#67d7eb" stroke-width="2" opacity=".6"/><path class="traffic-a" d="M1180 448L1090 620" fill="none" stroke="#67d7eb" stroke-width="2" opacity=".6"/><path class="traffic-a" d="M1180 448L1260 620" fill="none" stroke="#67d7eb" stroke-width="2" opacity=".6"/></g>
<g font-family="Arial">
<g transform="translate(970 500)"><rect width="125" height="66" rx="13" fill="#1b3856" stroke="#8ea5ff"/><text x="62" y="27" text-anchor="middle" font-size="21" fill="#d8e7ff">▤</text><text x="62" y="49" text-anchor="middle" class="tiny">DATABASES</text></g>
<g transform="translate(1105 500)"><rect width="125" height="66" rx="13" fill="#1b3856" stroke="#67d7eb"/><text x="62" y="27" text-anchor="middle" font-size="21" fill="#d8faff">▧</text><text x="62" y="49" text-anchor="middle" class="tiny">CONTENT</text></g>
<g transform="translate(1240 500)"><rect width="125" height="66" rx="13" fill="#1b3856" stroke="#d7f28c"/><text x="62" y="27" text-anchor="middle" font-size="21" fill="#e7f8c2">◇</text><text x="62" y="49" text-anchor="middle" class="tiny">OBJECT DATA</text></g>
<g transform="translate(1035 590)"><rect width="140" height="66" rx="13" fill="#1b3856" stroke="#a99cff"/><text x="70" y="27" text-anchor="middle" font-size="21" fill="#ded8ff">⌘</text><text x="70" y="49" text-anchor="middle" class="tiny">VECTOR STORES</text></g>
<g transform="translate(1190 590)"><rect width="140" height="66" rx="13" fill="#1b3856" stroke="#8ea5ff"/><text x="70" y="27" text-anchor="middle" font-size="21" fill="#d8e7ff">◎</text><text x="70" y="49" text-anchor="middle" class="tiny">KNOWLEDGE</text></g></g>
<text x="52" y="710" class="tiny">THE NEW WAVE IS ALREADY ARRIVING</text><text x="720" y="710" text-anchor="middle" class="tiny">FROM BOTTLENECK TO GOVERNED ACCESS AT SCALE</text><text x="1385" y="710" text-anchor="end" class="tiny">YOUR DATA · YOUR RULES</text>
</svg>