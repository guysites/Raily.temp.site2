<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Raily connects an evolving AI ecosystem with changing organizational infrastructure</title>
<desc id="desc">AI agents, models and protocols evolve on the left. Organizational databases, content, storage and applications evolve on the right. Raily remains a stable governed access layer between them, with data flows moving in both directions.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142b49"/><stop offset="1" stop-color="#091629"/></linearGradient>
 <radialGradient id="centerGlow"><stop stop-color="#6688ee" stop-opacity=".30"/><stop offset="1" stop-color="#6688ee" stop-opacity="0"/></radialGradient>
 <linearGradient id="flowAI"><stop stop-color="#a99cff"/><stop offset=".5" stop-color="#8ea5ff"/><stop offset="1" stop-color="#67d7eb"/></linearGradient>
 <linearGradient id="flowData"><stop stop-color="#67d7eb"/><stop offset=".5" stop-color="#8ea5ff"/><stop offset="1" stop-color="#d7f28c"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .ey{font:700 12px Arial;letter-spacing:2px;fill:#91a9d0}.h{font:700 17px Arial;fill:#eff5ff}.s{font:12px Arial;fill:#a9bdd7}.micro{font:700 9px Arial;letter-spacing:1.4px;fill:#9db2d0}
  .node{fill:#1a3454;stroke:#7895c9;stroke-opacity:.52;stroke-width:1.2}.aiNode{stroke:#a99cff;stroke-opacity:.65}.dataNode{stroke:#67d7eb;stroke-opacity:.62}
  .flow{fill:none;stroke-linecap:round;stroke-width:2.5;stroke-dasharray:5 13;animation:dash 6s linear infinite}.aiFlow{stroke:url(#flowAI)}.dataFlow{stroke:url(#flowData);animation-direction:reverse}
  .ghost{fill:none;stroke:#9eb3d7;stroke-opacity:.22;stroke-width:1.2;stroke-dasharray:4 7;animation:fade 5s ease-in-out infinite}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-180}}@keyframes fade{0%,100%{opacity:.25}50%{opacity:.9}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.flow,.ghost,.pulse{animation:none}}
 </style>
</defs>
<rect width="1440" height="650" rx="26" fill="url(#bg)"/>
<ellipse cx="720" cy="320" rx="620" ry="350" fill="url(#centerGlow)"/>
<g opacity=".08" stroke="#8ea5ff"><path d="M0 130H1440M0 260H1440M0 390H1440M0 520H1440"/><path d="M180 0V650M360 0V650M540 0V650M720 0V650M900 0V650M1080 0V650M1260 0V650"/></g>
<!-- AI ecosystem: three stable connection types and four emerging ones -->
<text x="58" y="62" class="ey">THE AI ECOSYSTEM</text><text x="58" y="91" class="s">New ways to connect keep emerging</text>
<defs>
 <style>
  .emerge{transform-box:fill-box;transform-origin:center;animation:emerge 9s ease-in-out infinite}
  .emerge.e4{animation-delay:-4.4s}.emerge.e5{animation-delay:-5.5s}.emerge.e6{animation-delay:-6.6s}.emerge.e7{animation-delay:-1.1s}
  .left-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 10}
  .fixed-line{opacity:.82;animation:dash 1.8s linear infinite}
  .emerge-line{opacity:0;animation:lineLife 9s ease-in-out infinite,dash 1.8s linear infinite}
  .emerge-line.e4{animation-delay:-4.4s,-4.4s}.emerge-line.e5{animation-delay:-5.5s,-5.5s}.emerge-line.e6{animation-delay:-6.6s,-6.6s}.emerge-line.e7{animation-delay:-1.1s,-1.1s}
  @keyframes emerge{0%,8%{opacity:0;transform:translateY(12px) scale(.97)}18%,66%{opacity:1;transform:translateY(0) scale(1)}78%,100%{opacity:0;transform:translateY(-8px) scale(.98)}}
  @keyframes lineLife{0%,8%{opacity:0}18%,66%{opacity:.82}78%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.emerge,.emerge-line,.fixed-line{animation:none;opacity:1;transform:none}}
 </style>
</defs>
<!-- Each connection has its own path. Dashes keep moving for as long as the connection exists. -->
<g>
 <path class="left-line fixed-line" stroke="#b6a7ff" d="M278 142C380 142 430 210 548 210"/>
 <path class="left-line fixed-line" stroke="#75d9ed" d="M278 204C380 204 430 250 548 250"/>
 <path class="left-line fixed-line" stroke="#a99cff" d="M278 266C380 266 430 290 548 290"/>
 <path class="left-line emerge-line e4" stroke="#d7f28c" d="M278 328C380 328 430 330 548 330"/>
 <path class="left-line emerge-line e5" stroke="#75d9ed" d="M278 390C380 390 430 370 548 370"/>
 <path class="left-line emerge-line e6" stroke="#b6a7ff" d="M278 452C380 452 430 410 548 410"/>
 <path class="left-line emerge-line e7" stroke="#67d7eb" d="M278 514C380 514 430 450 548 450"/>
</g>
<!-- 1: permanent -->
<g>
 <rect class="node aiNode" x="58" y="114" width="220" height="56" rx="14"/>
 <circle cx="86" cy="142" r="14" fill="#344579"/><path d="M86 131l4 7 7 4-7 4-4 7-4-7-7-4 7-4Z" fill="#d4ceff"/>
 <text x="110" y="139" class="h">Personal AI</text><text x="110" y="157" class="s">Acting for individuals</text>
</g>
<!-- 2: emerging -->
<g>
 <rect class="node aiNode" x="58" y="176" width="220" height="56" rx="14"/>
 <circle cx="86" cy="204" r="14" fill="#254b68"/><rect x="76" y="194" width="20" height="20" rx="5" fill="#c4f3ff"/><circle cx="82" cy="201" r="1.6" fill="#1c3c5b"/><circle cx="90" cy="201" r="1.6" fill="#1c3c5b"/><path d="M81 207h9" stroke="#1c3c5b" stroke-width="1.6"/>
 <text x="110" y="201" class="h">Autonomous agents</text><text x="110" y="219" class="s">Searching · deciding · acting</text>
</g>
<!-- 3: permanent -->
<g>
 <rect class="node aiNode" x="58" y="238" width="220" height="56" rx="14"/>
 <circle cx="86" cy="266" r="14" fill="#3b416d"/><path d="M77 261h18v11H77zM81 257h10" fill="none" stroke="#d0d5ff" stroke-width="1.8"/>
 <text x="110" y="263" class="h">AI applications</text><text x="110" y="281" class="s">Customer · partner · public</text>
</g>
<!-- 4: a new emerging connection type -->
<g class="emerge e4">
 <rect class="node aiNode" x="58" y="300" width="220" height="56" rx="14"/>
 <circle cx="86" cy="328" r="14" fill="#344579"/><path d="M77 328c4-9 14-9 18 0-4 9-14 9-18 0Z" fill="none" stroke="#d7f28c" stroke-width="1.7"/><circle cx="86" cy="328" r="3" fill="#d7f28c"/>
 <text x="110" y="325" class="h">Multimodal AI</text><text x="110" y="343" class="s">Voice · vision · new inputs</text>
</g>
<!-- 5: permanent -->
<g class="emerge e5">
 <rect class="node aiNode" x="58" y="362" width="220" height="56" rx="14"/>
 <circle cx="86" cy="390" r="14" fill="#344579"/><path d="M79 390h14M86 383v14" stroke="#c4f3ff" stroke-width="1.8" stroke-linecap="round"/>
 <text x="110" y="387" class="h">Voice &amp; ambient AI</text><text x="110" y="405" class="s">Always-on experiences</text>
</g>
<!-- 6: emerging -->
<g class="emerge e6">
 <rect class="node aiNode" x="58" y="424" width="220" height="56" rx="14"/>
 <circle cx="86" cy="452" r="14" fill="#344579"/><path d="M78 444h16v16H78zM82 448h8M82 452h8M82 456h5" fill="none" stroke="#d0d5ff" stroke-width="1.4"/>
 <text x="110" y="449" class="h">New protocols</text><text x="110" y="467" class="s">New ways to interact</text>
</g>
<!-- 7: emerging -->
<g class="emerge e7">
 <rect class="node aiNode" x="58" y="486" width="220" height="56" rx="14"/>
 <circle cx="86" cy="514" r="14" fill="#344579"/><path d="M78 508h16v12H78zM82 504h8" fill="none" stroke="#c8d5ff" stroke-width="1.7"/>
 <text x="110" y="511" class="h">New interfaces</text><text x="110" y="529" class="s">The next interaction model</text>
</g>
<!-- Stable middle -->
<text x="575" y="62" class="ey">THE STABLE INTERFACE</text>
<rect x="548" y="112" width="344" height="426" rx="28" fill="#142943" stroke="#8ea5ff" stroke-opacity=".62" stroke-width="1.6"/>
<rect x="559" y="123" width="322" height="404" rx="21" fill="none" stroke="#fff" stroke-opacity=".055"/>
<circle cx="590" cy="158" r="6" fill="#d7f28c" filter="url(#glow)"/><text x="612" y="166" font-family="Arial" font-size="25" font-weight="700" fill="#f2f6ff">Raily</text><text x="854" y="164" text-anchor="end" class="micro">AI ACCESS PLATFORM</text>
<path d="M578 190H862" stroke="#8ea5ff" stroke-opacity=".22"/>
<g>
 <rect x="580" y="214" width="280" height="74" rx="14" fill="#173d55" stroke="#67d7eb" stroke-opacity=".65"/><circle cx="610" cy="251" r="15" fill="#24556a"/><path d="M601 251h18m-9-9v18" stroke="#67d7eb" stroke-width="2" stroke-linecap="round"/><text x="638" y="245" class="micro">01 / CONNECT</text><text x="638" y="267" class="h">Meet existing systems</text>
 <rect x="580" y="303" width="280" height="92" rx="14" fill="#292f5b" stroke="#a99cff" stroke-opacity=".7"/><text x="600" y="330" class="micro">02 / CONTEXTUALIZE</text><text x="600" y="354" class="h">Make information meaningful</text>
 <g stroke-width="1.5" fill="none"><path d="M602 374l22-9 20 9 20-10 20 10" stroke="#67d7eb"/><path d="M624 365l1 16 20-7 19 8" stroke="#a99cff"/><path d="M644 374l20-9 20 10" stroke="#d7f28c"/></g><g fill="#d9e2ff"><circle cx="602" cy="374" r="3"/><circle cx="624" cy="365" r="3"/><circle cx="644" cy="374" r="4"/><circle cx="664" cy="365" r="3"/><circle cx="684" cy="375" r="3"/></g>
 <rect x="580" y="410" width="280" height="94" rx="14" fill="#263f43" stroke="#d7f28c" stroke-opacity=".7"/><circle cx="610" cy="455" r="15" fill="#405b47"/><path d="M610 441l10 4v8c0 7-10 12-10 12s-10-5-10-12v-8z" fill="none" stroke="#d7f28c" stroke-width="1.6"/><text x="638" y="447" class="micro">03 / EXPOSE &amp; CONTROL</text><text x="638" y="470" class="h">Govern every interaction</text><text x="638" y="488" class="s">Identity · permissions · usage</text>
</g>
<text x="720" y="572" text-anchor="middle" class="micro">ONE CONSISTENT ACCESS LAYER</text>
<!-- Organization infrastructure: multiple familiar systems and future additions -->
<text x="1110" y="62" class="ey">YOUR ORGANIZATION</text><text x="1110" y="91" class="s">Your infrastructure keeps evolving</text>
<g>
 <rect class="node dataNode" x="1110" y="142" width="270" height="66" rx="15"/><g transform="translate(1130 159)" fill="none" stroke="#67d7eb" stroke-width="1.8"><ellipse cx="17" cy="6" rx="14" ry="6"/><path d="M3 6v25c0 8 28 8 28 0V6M3 18c0 8 28 8 28 0"/></g><text x="1180" y="180" class="h">Databases</text><text x="1180" y="197" class="s">Structured records</text>
 <rect class="node dataNode" x="1110" y="229" width="270" height="66" rx="15"/><g transform="translate(1130 246)" fill="none" stroke="#67d7eb" stroke-width="1.8"><rect x="3" y="1" width="28" height="32" rx="3"/><path d="M9 10h16M9 17h16M9 24h11"/></g><text x="1180" y="267" class="h">Content &amp; knowledge</text><text x="1180" y="284" class="s">CMS · documents · archives</text>
 <rect class="node dataNode" x="1110" y="316" width="270" height="66" rx="15"/><g transform="translate(1130 333)" fill="none" stroke="#67d7eb" stroke-width="1.8"><path d="M3 10l14-8 14 8v19l-14 8-14-8zM3 10l14 8 14-8M17 18v19"/></g><text x="1180" y="354" class="h">Storage &amp; repositories</text><text x="1180" y="371" class="s">Object stores · file systems</text>
 <rect class="node dataNode" x="1110" y="403" width="270" height="66" rx="15"/><g transform="translate(1130 420)" fill="none" stroke="#a99cff" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><circle cx="27" cy="7" r="5"/><circle cx="17" cy="27" r="5"/><path d="M11 11l4 11m8-11-5 11M12 7h10"/></g><text x="1180" y="441" class="h">Vector DBs &amp; APIs</text><text x="1180" y="458" class="s">Existing AI &amp; service layers</text>
 <rect class="ghost" x="1140" y="492" width="210" height="56" rx="15"/><text x="1245" y="515" text-anchor="middle" class="micro">WHAT'S NEXT</text><text x="1245" y="533" text-anchor="middle" class="s">New systems · new data</text>
</g>
<!-- Dynamic connection paths: both ecosystems can change independently -->
<g fill="none" stroke-linecap="round">
 
 <path d="M892 236C990 236 1000 175 1110 175" stroke="#67d7eb" stroke-opacity=".38" stroke-width="1.5"/><path d="M892 298H1110" stroke="#67d7eb" stroke-opacity=".38" stroke-width="1.5"/><path d="M892 466C990 466 1000 436 1110 436" stroke="#d7f28c" stroke-opacity=".38" stroke-width="1.5"/>
 
 <path class="flow dataFlow" d="M892 236C990 236 1000 175 1110 175M892 298H1110M892 466C990 466 1000 436 1110 436"/>
</g>
<g filter="url(#glow)"><circle r="4" fill="#67d7eb"><animateMotion dur="5.4s" begin="-1.5s" repeatCount="indefinite" path="M1110 175C1000 175 990 236 892 236"/></circle><circle r="4" fill="#67d7eb"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M1110 298H892"/></circle><circle r="4" fill="#d7f28c"><animateMotion dur="5.7s" begin="-2s" repeatCount="indefinite" path="M1110 436C1000 436 990 466 892 466"/></circle></g>
<text x="720" y="620" text-anchor="middle" class="micro">THE ECOSYSTEM CHANGES. YOUR ACCESS LAYER STAYS CONSISTENT.</text>
</svg>